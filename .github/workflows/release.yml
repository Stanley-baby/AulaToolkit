name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: Beta
        type: choice
        options:
          - Stable
          - Beta

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      VERSION: ${{ github.event.inputs.version }}
      CHANNEL: ${{ github.event.inputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Invalid version '$env:VERSION'. Expected X.Y.Z"; exit 1 }

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version

      - name: Check and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-vite build
          npx electron-builder --win --publish never

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            "release/AULA-Toolkit-Setup-$env:VERSION.exe",
            "release/AULA-Toolkit-Setup-$env:VERSION.exe.blockmap",
            "release/AULA-Toolkit-$env:VERSION-portable.exe",
            "release/latest.yml"
          )
          $kind = if ($env:CHANNEL -eq 'Beta') { '--prerelease' } else { '--latest' }
          gh release create "v$env:VERSION" @files --target $env:GITHUB_SHA --title "AULA Toolkit v$env:VERSION ($env:CHANNEL)" --notes-file .github/release-notes.md $kind
