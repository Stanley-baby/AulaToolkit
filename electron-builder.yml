appId: dev.aulatoolkit.app
productName: AULA Toolkit
electronDist: node_modules/electron/dist
publish:
  provider: github
  owner: Stanley-baby
  repo: AulaToolkit
  releaseType: release
directories:
  output: release
files:
  - out/**
  - package.json
  - resources/icon.png
extraResources:
  - from: resources/mac
    to: mac
    filter:
      - display-watch
  - from: resources/display-watch.ps1
    to: display-watch.ps1
  - from: resources/media-watch.ps1
    to: media-watch.ps1
  - from: resources/vendor-restore.ps1
    to: vendor-restore.ps1
  - from: resources/cli
    to: cli
  - from: resources/bin
    to: bin
asarUnpack:
  - "**/node_modules/node-hid/**"
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  artifactName: AULA-Toolkit-Setup-${version}.${ext}
  license: LICENSE
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: resources/installer.nsh
portable:
  artifactName: AULA-Toolkit-${version}-portable.${ext}

mac:
  identity: "-"
  icon: resources/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  minimumSystemVersion: "14.2"
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  artifactName: AULA-Toolkit-${version}-mac-${arch}.${ext}
  extendInfo:
    NSAudioCaptureUsageDescription: System audio is analyzed locally to animate keyboard lighting.
    NSScreenCaptureUsageDescription: Screen and system audio access enables music-reactive keyboard lighting.
